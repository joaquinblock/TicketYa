server:
  port: 8081

spring:
  application:
    name: auth-service
  http:
    serviceclient:
      event-service:
        base-url: ${EVENT_SERVICE_URL:http://localhost:8082}
        connect-timeout: 1s
        read-timeout: 2s
  docker:
    compose:
      file: compose.yaml
      # Al frenar la app el contenedor sigue corriendo y no se pierden los datos
      lifecycle-management: start-only
  jpa:
    hibernate:
      # Mientras el modelo cambia: recrea las tablas en cada arranque y el AuthSeeder carga los datos.
      # Cuando se estabilice, pasar a validate + migraciones (Flyway).
      ddl-auto: create
    open-in-view: false
  jackson:
    deserialization:
      # Sin esto, {"userId": 1.5} se redondea a 1 en vez de dar 400
      accept-float-as-int: false

# Swagger del servicio: http://localhost:8081/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /api-docs


ticketya:
  jwt:
    issuer: ticketya-auth
    audience: ticketya-api
    ttl: 30m
    # Ruta al .pem PKCS#8 con la clave privada RSA. Nunca va en el repo. Vacía: clave efímera (solo desarrollo)
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
  google:
    # Client id de OAuth del proyecto de Google Cloud. No es secreto. Vacío: el login con Google responde 503
    client-id: ${GOOGLE_CLIENT_ID:}
  # Gmail del primer admin: al entrar con Google queda vinculado al admin del seeder. Vacío: admin@ticketya.com
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
