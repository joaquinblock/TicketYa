server:
  port: 8085

spring:
  application:
    name: queue-service
  http:
    clients:
      connect-timeout: 1s
      read-timeout: 10s
    serviceclient:
      event-service:
        base-url: ${EVENT_SERVICE_URL:http://localhost:8082}
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only

ticketya:
  queue:
    batch-size: ${QUEUE_BATCH_SIZE:100}
    batch-interval: ${QUEUE_BATCH_INTERVAL:30s}
    enabled-window: ${QUEUE_ENABLED_WINDOW:10m}
    jwt:
      issuer: ${QUEUE_JWT_ISSUER:ticketya-queue}
      audience: ${QUEUE_JWT_AUDIENCE:ticket-service}
      private-key-location: ${QUEUE_JWT_PRIVATE_KEY_LOCATION:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /api-docs


management:
  endpoints:
    web:
      exposure:
        include: health,info
