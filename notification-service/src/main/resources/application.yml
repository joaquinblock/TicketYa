server:
  port: 8086

spring:
  application:
    name: notification-service
  http:
    serviceclient:
      auth-service:
        base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
        connect-timeout: 1s
        read-timeout: 2s
      event-service:
        base-url: ${EVENT_SERVICE_URL:http://localhost:8082}
      ticket-service:
        base-url: ${TICKET_SERVICE_URL:http://localhost:8083}
        connect-timeout: 1s
        read-timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticketya}
    password: ${RABBITMQ_PASSWORD:ticketya}
    connection-timeout: 2s
    listener:
      simple:
        # 3 intentos en total (max-retries cuenta los reintentos), con 1 s y 2 s de espera.
        # Al agotarlos, RabbitConfig manda el mensaje a notification.purchase.dlq.
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  # Mailpit (compose.yaml) recibe los mails sin enviarlos: se ven en http://localhost:8025
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # Sin estos límites, un SMTP que no contesta deja colgado el listener con la transacción abierta (en ms)
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /api-docs


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Muestra qué componente está caído (p. ej. rabbit) sin exponer sus detalles
      show-components: always

ticketya:
  mail:
    from: ${MAIL_FROM:no-reply@ticketya.com}
