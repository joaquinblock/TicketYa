spring:
  docker:
    compose:
      skip:
        in-tests: false
  jpa:
    hibernate:
      ddl-auto: create-drop
ticketya:
  compensation:
    # El job de compensación corre a mano en los tests: si no, toma lo que dejan pendiente otros tests
    refund-check: PT1H
  payment-attempt:
    # Igual que la compensación: se corre a mano en los tests
    resolution-check: PT1H
