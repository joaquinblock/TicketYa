server:
  port: 8083

spring:
  application:
    name: ticket-service
  http:
    serviceclient:
      event-service:
        base-url: ${EVENT_SERVICE_URL:http://localhost:8082}
        connect-timeout: 1s
        read-timeout: 2s
      payment-service:
        base-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
        connect-timeout: 1s
        read-timeout: 20s
  task:
    scheduling:
      pool:
        size: 3
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticketya}
    password: ${RABBITMQ_PASSWORD:ticketya}
    connection-timeout: 2s
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  jackson:
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true

ticketya:
  time-zone: America/Argentina/Buenos_Aires
  reservation:
    hold: 10m
    payment-margin: 1m
    max-rejected-payments: 3
    expiration-check: PT30S
  cancellation:
    refund-check: PT30S

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /api-docs


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Muestra qué componente está caído (p. ej. rabbit) sin exponer sus detalles
      show-components: always
