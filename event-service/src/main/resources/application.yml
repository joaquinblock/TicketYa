server:
  port: 8082

spring:
  application:
    name: event-service
  http:
    serviceclient:
      auth-service:
        base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
      ticket-service:
        base-url: ${TICKET_SERVICE_URL:http://localhost:8083}
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /api-docs


management:
  endpoints:
    web:
      exposure:
        include: health,info
