server:
  port: 8084

spring:
  application:
    name: payment-service
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
  jackson:
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true

ticketya:
  logging:
      correlation:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

payment:
  gateway:
    # Peor caso: 3 × 3s + 2 × 500ms ≈ 10s, debajo de los 20s que ticket-service espera a payment-service.
    resilience:
      timeout: 3s
      max-attempts: 3
      wait-between-attempts: 500ms
      sliding-window-size: 10
      minimum-calls: 5
      failure-rate-threshold: 50
      wait-in-open-state: 10s
      calls-in-half-open-state: 2
  mock:
    rejected-method: DEBIT_CARD
    delay-ms: 0
    down: false
