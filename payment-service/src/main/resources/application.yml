server:
  port: 8084

spring:
  application:
    name: payment-service
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
  jackson:
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

payment:
  mock:
    rejected-method: DEBIT_CARD
