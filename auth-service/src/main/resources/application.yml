server:
  port: 8081

spring:
  application:
    name: auth-service
  http:
    serviceclient:
      event-service:
        base-url: ${EVENT_SERVICE_URL:http://localhost:8082}
  docker:
    compose:
      file: compose.yaml
      # Al frenar la app el contenedor sigue corriendo y no se pierden los datos
      lifecycle-management: start-only
  jpa:
    hibernate:
      # Mientras el modelo cambia: recrea las tablas en cada arranque y el AuthSeeder carga los datos.
      # Cuando se estabilice, pasar a validate + migraciones (Flyway).
      ddl-auto: create
    open-in-view: false

# Swagger del servicio: http://localhost:8081/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /api-docs


management:
  endpoints:
    web:
      exposure:
        include: health,info
