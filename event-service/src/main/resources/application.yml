server:
  port: 8082

spring:
  application:
    name: event-service
  http:
    serviceclient:
      # Sin timeouts, un servicio colgado deja el request esperando para siempre (ver microservices.md).
      # Los permisos y la organización llegan en los headers del api-gateway: no se le pregunta nada al auth-service.
      ticket-service:
        base-url: ${TICKET_SERVICE_URL:http://localhost:8083}
        connect-timeout: 1s
        read-timeout: 10s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:ticketya}
    password: ${RABBITMQ_PASSWORD:ticketya}
    connection-timeout: 2s
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false

ticketya:
  time-zone: America/Argentina/Buenos_Aires
  events:
    finish-check: PT1M
  http:
    retry:
      max-attempts: 2   # el intento original + 1 reintento, solo GET y solo si no hubo respuesta
      backoff: 200ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /api-docs


management:
  tracing:
    export:
      zipkin:
        # Las trazas van a Zipkin solo con observability.compose.yaml (ADR 0010)
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
