server:
  port: 8082

spring:
  application:
    name: event-service
  http:
    serviceclient:
      # Sin timeouts, un servicio colgado deja el request esperando para siempre (ver microservices.md)
      auth-service:
        base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
        connect-timeout: 1s
        read-timeout: 2s
      ticket-service:
        base-url: ${TICKET_SERVICE_URL:http://localhost:8083}
        connect-timeout: 1s
        read-timeout: 10s
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false

ticketya:
  http:
    retry:
      max-attempts: 2   # el intento original + 1 reintento, solo GET y solo si no hubo respuesta
      backoff: 200ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /api-docs


management:
  endpoints:
    web:
      exposure:
        include: health,info
