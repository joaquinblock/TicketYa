# auth-service con su base, para el sistema completo (lo incluye el docker-compose.yml de la raíz).
# No es el compose.yaml de al lado: ese levanta solo la base para spring-boot:run.
services:
  auth-service:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/auth_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-group10}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-group10}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-internal-secret}
      EVENT_SERVICE_URL: http://event-service:8082
      # Opcionales: sin el client id, el login con Google responde 503 y se entra con dev-login
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      # Sin JWT_PRIVATE_KEY_LOCATION la clave es efímera: al reiniciar auth-service los tokens emitidos dejan de valer.
      # Pendiente: pasarla como Docker secret (comentario de la épica #11).
    # Sin ports: solo lo alcanzan el api-gateway y los otros servicios por la red de Docker (ADR-003)
    depends_on:
      auth-db:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      # La imagen no trae curl ni wget: bash pide /actuator/health por /dev/tcp
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/localhost/8081 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  auth-db:
    image: mysql:8.4
    # Buffer chico y sin performance_schema: la base de prueba no necesita más y así entran todas en la máquina
    command: ["--innodb-buffer-pool-size=32M", "--performance-schema=OFF"]
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: ${DB_USER:-group10}
      MYSQL_PASSWORD: ${DB_PASSWORD:-group10}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-group10}
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
