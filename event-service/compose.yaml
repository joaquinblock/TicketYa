name: ticketya-event
services:
  event-db:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=event_db'
      - 'MYSQL_USER=group10'
      - 'MYSQL_PASSWORD=group10'
      - 'MYSQL_ROOT_PASSWORD=group10'
    ports:
      - '3308:3306'
  event-redis:
    image: 'redis:7.4'
    ports:
      # 6379 es del Redis de queue-service
      - '6380:6379'
