server:
  port: 8087

spring:
  application:
    name: recommendation-service
  http:
    serviceclient:
      event-service:
        base-url: ${EVENT_SERVICE_URL:http://localhost:8082}
      ticket-service:
        base-url: ${TICKET_SERVICE_URL:http://localhost:8083}
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-only

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /api-docs


management:
  endpoints:
    web:
      exposure:
        include: health,info
